[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-edges"
version = "2.0.0"
description = "Production-ready execution-aware analytics for Polymarket data - informational only, no trading"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Polymarket Edges", email = "noreply@example.com"}
]
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "typer>=0.12.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.31.0",
    "rich>=13.0.0",
    "openai>=1.12.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
polymarket-edges = "polymarket_edges.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
