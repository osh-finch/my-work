[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poly-top"
version = "0.1.0"
description = "CLI tool for ranking Polymarket markets by volume, liquidity, and competitiveness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
]

[project.scripts]
poly-top = "poly_top.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
